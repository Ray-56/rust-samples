[package]
name = "my_blog_os"
version = "0.1.0"

# # Configuration required when compiling using `cargo build`
# [profile.dev]
# panic = "abort" # Disable panic when stack unwinding

# # Configuration required when compiling using `cargo build --release`
# [profile.release]
# panic = "abort" # Disable panic when stack unwinding

[package.metadata.bootimage]
build-command = ["xbuild"]
test-args = [
    "-device", "isa-debug-exit,iobase=0xf4,iosize=0x04", "-serial", "stdio",
    "-display", "none"
]
test-success-exit-code = 33
test-timeout = 300          # (in seconds)

[dependencies]
bootloader = "0.9.3"
volatile = "0.2.6"
spin = "0.5.2"
x86_64 = "0.14.2"
uart_16550 = "0.2.0"

[dependencies.lazy_static]
version = "1.0"
features = ["spin_no_std"]
