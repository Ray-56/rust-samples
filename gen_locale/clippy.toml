# clippy.toml
# Clippy configurable parameters (thresholds, modes, etc.)
# Note: lint level (allow/deny/warn) should be configured in [lints.clippy] of Cargo.toml

# Cognitive complexity threshold (default 25, database code allows more complexity)
cognitive-complexity-threshold = 30

# Threshold for the number of function parameters (default 7, data structures such as B+Tree require more parameters)
too-many-arguments-threshold = 10

# Type complexity threshold
type-complexity-threshold = 300

# Enum variant size threshold (default 200, Value enums may be larger)
enum-variant-size-threshold = 300

# Minimum supported Rust version (consistent with Cargo.toml)
msrv = "1.75"
