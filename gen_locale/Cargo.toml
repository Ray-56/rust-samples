[package]
name = "gen_locale"
version = "1.0.1"
edition = "2021"
authors = ["guokangf@gmail.com"]
license = "MIT"
description = "Generate locale `ts|json` files from Excel file"

[dependencies]
calamine = "0.19"
clap = { version = "4.1", features = ["derive", "cargo"] }
csv = "1.3.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[dev-dependencies]
assert_cmd = "2"
tempfile = "3.8"
