# rustfmt.toml
# Configurations supported by Stable versions (project uses Rust 1.75+ stable channel)

# Basic settings
edition = "2021"
style_edition = "2021"       # The 2024 style edition requires nightly; 2021 is more stable
max_width = 100
tab_spaces = 2
newline_style = "Unix"
use_small_heuristics = "Max"

# Chain call and function call width
chain_width = 60
fn_call_width = 60

# Imports and module sorting
reorder_imports = true
reorder_modules = true

# code cleanup
remove_nested_parens = true
merge_derives = true

# Match expression
match_arm_leading_pipes = "Preserve"
match_block_trailing_comma = false   # Default value, kept for consistency

# Function parameter layout
fn_params_layout = "Tall" # Default value, works well for functions with many parameters

# Field initialization abbreviation (enabled by default in 2021 edition)
use_field_init_shorthand = true
use_try_shorthand = true        # Use ? instead of the try! macro

# Single line expression threshold
single_line_if_else_max_width = 50
single_line_let_else_max_width = 50

# NOTE: The following options require nightly channels (removed):
# - indent_style, spaces_around_ranges, binop_separator
# - match_arm_blocks, trailing_comma, trailing_semicolon
# - fn_single_line, where_single_line
# - imports_granularity, group_imports
#
# To use these features, you need to switch to nightly and set unstable_features = true
